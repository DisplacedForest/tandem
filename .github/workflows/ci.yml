name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vera-api/requirements*.txt
      - name: Install dependencies
        run: pip install -r services/vera-api/requirements.txt -r services/vera-api/requirements-dev.txt
      - name: Run tests
        working-directory: services/vera-api
        run: python -m pytest -q

  mac-app:
    name: mac-app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: apps/vera-mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/vera-mac/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        working-directory: apps/vera-mac
        run: swift build
      - name: Selftest
        working-directory: apps/vera-mac
        run: |
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 26 ]; then
            .build/debug/Vera --selftest
          else
            echo "runner macOS $(sw_vers -productVersion) is below the app's macOS 26 floor; the build is the check here and the selftest runs on deployments"
          fi

  leak-gate:
    name: leak-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan tracked tree for leaks
        env:
          VERA_OWNER_NAME: ${{ secrets.VERA_OWNER_NAME }}
          HOME_LOCATION_NAME: ${{ secrets.HOME_LOCATION_NAME }}
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          LEAK_GATE_SCRIPT: ${{ secrets.LEAK_GATE_SCRIPT }}
          LEAK_GATE_ALLOW: ${{ secrets.LEAK_GATE_ALLOW }}
        run: |
          if [ -z "$LEAK_GATE_SCRIPT" ]; then
            echo "leak-gate: skipped (gate not available in this context)"
            exit 0
          fi
          printf '%s' "$LEAK_GATE_SCRIPT" | base64 -d > scripts/leak-gate.sh
          if [ -n "$LEAK_GATE_ALLOW" ]; then
            printf '%s' "$LEAK_GATE_ALLOW" | base64 -d > scripts/leak-allow.txt
          fi
          sh scripts/leak-gate.sh
