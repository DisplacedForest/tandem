[tasks.api-test]
dir = "services/vera-api"
run = "python -m pytest -q"

[tasks.mac-build]
dir = "apps/vera-mac"
run = "swift build"

[tasks.leak-gate]
run = "scripts/leak-gate.sh"

[tasks.copy-check]
run = "scripts/check-copy.sh"

[tasks.lint]
depends = ["leak-gate", "copy-check"]

[tasks.provider-test]
run = "python3 -m unittest discover -s scripts/tests -p 'test_openrouter_smoke.py' -v"

[tasks.native-provider-test]
dir = "apps/vera-mac"
depends = ["mac-build"]
run = ".build/debug/Vera --provider-smoke-selftest"

[tasks.native-admission-test]
depends = ["mac-build"]
env = { VERA_NATIVE_ADMISSION_TEST = "1" }
dir = "services/vera-api"
run = "python -m pytest -q tests/test_native_inference_admission.py"

[tasks.native-task-test]
depends = ["mac-build"]
env = { VERA_NATIVE_TASK_TEST = "1", VERA_NATIVE_TASK_LIVE = "0" }
dir = "services/vera-api"
run = "python -m pytest -q tests/test_native_task_handoff.py"

[tasks.signing-test]
run = "python3 -m unittest discover -s scripts/tests -p 'test_local_signing.py' -v"

[tasks.test]
depends = ["api-test", "provider-test", "native-provider-test", "native-admission-test", "native-task-test", "signing-test"]

[tasks.check]
depends = ["lint", "test", "mac-build"]

[tasks.ci]
depends = ["check"]

[tasks.security]
run = "semgrep scan --config auto --error services scripts"
