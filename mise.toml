[tasks.api-test]
dir = "services/vera-api"
run = "python -m pytest -q"

[tasks.mac-build]
dir = "apps/vera-mac"
run = "swift build"

[tasks.leak-gate]
run = "scripts/leak-gate.sh"

[tasks.copy-check]
run = "scripts/check-copy.sh"

[tasks.lint]
depends = ["leak-gate", "copy-check"]

[tasks.provider-test]
run = "python3 -m unittest discover -s scripts/tests -p 'test_openrouter_smoke.py' -v"

[tasks.native-provider-test]
dir = "apps/vera-mac"
depends = ["mac-build"]
run = ".build/debug/Vera --provider-smoke-selftest"

[tasks.native-admission-test]
depends = ["mac-build"]
env = { VERA_NATIVE_ADMISSION_TEST = "1" }
dir = "services/vera-api"
run = "python -m pytest -q tests/test_native_inference_admission.py"

[tasks.native-task-test]
depends = ["mac-build"]
env = { VERA_NATIVE_TASK_TEST = "1", VERA_NATIVE_TASK_LIVE = "0" }
dir = "services/vera-api"
run = "python -m pytest -q tests/test_native_task_handoff.py"

[tasks.signing-test]
run = "python3 -m unittest discover -s scripts/tests -p 'test_local_signing.py' -v"

[tasks.runtime-package-test]
run = "python3 -m unittest discover -s scripts/tests -p 'test_runtime_package.py' -v"

[tasks.test]
depends = ["api-test", "provider-test", "native-provider-test", "native-admission-test", "native-task-test", "signing-test", "runtime-package-test", "pi-prototype-test"]

[tasks.assistant-ui-test]
dir = "prototypes/assistant-ui"
run = "swift build && .build/debug/VeraPrototype --selftest"

[tasks.check]
depends = ["lint", "test", "mac-build", "assistant-ui-test", "pi-integration-test", "pi-native-transport-test", "pi-native-integration-test", "pi-app-broker-test", "engine-lifecycle-test", "selected-credential-authorization-test"]

[tasks.selected-credential-authorization-test]
run = "bash apps/vera-mac/scripts/test-selected-credential-authorization.sh"

[tasks.ci]
depends = ["check"]

[tasks.security]
run = "semgrep scan --config auto --error services scripts"

[tasks.pi-prototype-deps]
run = "npm ci --ignore-scripts --no-audit --no-fund --prefix prototypes/pi_assistant"

[tasks.pi-prototype-test]
depends = ["pi-prototype-deps", "assistant-ui-test"]
env = { PYTHONPATH = "prototypes:services/vera-api", PYTHONDONTWRITEBYTECODE = "1" }
run = "python -m pytest -q -p no:cacheprovider prototypes/pi_assistant/tests"

[tasks.pi-integration-test]
depends = ["pi-prototype-deps", "assistant-ui-test"]
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "python prototypes/pi_assistant/tests/integration_recovery.py"

[tasks.pi-native-transport-test]
dir = "prototypes/native-transport"
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "swift build && .build/debug/VeraNativeTransport --selftest && python3 tests/process_contract.py .build/debug/VeraNativeTransport && python3 tests/watchdog_contract.py .build/debug/VeraNativeTransport"

[tasks.pi-native-integration-test]
depends = ["pi-native-transport-test", "pi-prototype-deps"]
env = { PYTHONPATH = "prototypes:services/vera-api", PYTHONDONTWRITEBYTECODE = "1" }
run = "python -m pytest -q -p no:cacheprovider prototypes/pi_assistant/native_tests"

[tasks.pi-app-broker-test]
depends = ["mac-build", "pi-prototype-deps"]
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "apps/vera-mac/.build/debug/Vera --pi-broker-selftest && python -m pytest -q -p no:cacheprovider prototypes/pi_assistant/app_tests"

[tasks.engine-lifecycle-test]
run = "sh apps/vera-mac/scripts/test-engine-lifecycle.sh"
