<svg xmlns="http://www.w3.org/2000/svg" viewBox="-65 -105 540 466" role="img" aria-label="Tandem Breathe animation">
<style>.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}</style>
<defs>
    <linearGradient id="left-shading" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C9E6A5"/>
      <stop offset="1" stop-color="#90B66E"/>
    </linearGradient>
    <linearGradient id="right-shading" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A7CF86"/>
      <stop offset="1" stop-color="#628F47"/>
    </linearGradient>
    <linearGradient id="overlap-shading" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="410" y2="256">
      <stop stop-color="#BADC97"/>
      <stop offset="1" stop-color="#A2C780"/>
    </linearGradient>
    <clipPath id="moving-left"><circle cx="128" cy="128" r="128" fill="black"><animate attributeName="cx" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><animate attributeName="cy" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><animate attributeName="r" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/></circle></clipPath><clipPath id="static-left"><circle cx="128" cy="128" r="128"/></clipPath></defs>
<g class="moving"><g transform="translate(205 128)"><g><animateTransform attributeName="transform" type="rotate" values="0;0;0" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><g><animateTransform attributeName="transform" type="scale" values="1;1.028;1" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><g transform="translate(-205 -128)"><circle cx="128" cy="128" r="128" fill="url(#left-shading)"><animate attributeName="cx" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><animate attributeName="cy" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><animate attributeName="r" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/></circle><circle cx="282" cy="128" r="128" fill="url(#right-shading)"><animate attributeName="cx" values="282;282;282" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><animate attributeName="cy" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><animate attributeName="r" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/></circle><g clip-path="url(#moving-left)"><circle cx="282" cy="128" r="128" fill="url(#overlap-shading)"><animate attributeName="cx" values="282;282;282" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><animate attributeName="cy" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/><animate attributeName="r" values="128;128;128" keyTimes="0;0.5;1" keySplines="0.333333 0 0.666667 1;0.333333 0 0.666667 1" calcMode="spline" dur="4.8s" repeatCount="indefinite" fill="freeze"/></circle></g></g></g></g></g></g>
<g class="still"><circle cx="128" cy="128" r="128" fill="url(#left-shading)"/><circle cx="282" cy="128" r="128" fill="url(#right-shading)"/><g clip-path="url(#static-left)"><circle cx="282" cy="128" r="128" fill="url(#overlap-shading)"/></g></g>
</svg>
